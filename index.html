<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SBGN Visualization Demo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: #f5f5f5;
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
        }
        #cy {
            width: 100%;
            height: 600px;
            border: 2px solid #ddd;
            background: white;
            border-radius: 8px;
        }
        .controls {
            margin-bottom: 20px;
        }
        button {
            padding: 10px 20px;
            font-size: 14px;
            cursor: pointer;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
        }
        button:hover {
            background: #45a049;
        }
    </style>
</head>
<body>
    <h1>SBGN Biological Pathway Visualization</h1>
    <div class="controls">
        <button onclick="loadSBGNML()">Load SBGNML File</button>
    </div>
    <div id="cy"></div>

    <!-- Load dependencies from CDN -->
    <script src="https://unpkg.com/cytoscape@3.28.1/dist/cytoscape.min.js"></script>
    <script src="https://unpkg.com/sbgnml-to-cytoscape@4.0.4/dist/sbgnml-to-cytoscape.js"></script>
    <script src="https://unpkg.com/cytoscape-sbgn-stylesheet@4.0.2/build/bundle.js"></script>
    <script src="script.js"></script>
</body>
</html>
